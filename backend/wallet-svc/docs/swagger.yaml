basePath: /
definitions:
  internal_messaging.LifecycleEvent:
    properties:
      amount:
        type: integer
      app_id:
        type: string
      code:
        type: string
      event_type:
        type: string
      idempotency_key:
        type: string
      message:
        type: string
      order_id:
        type: string
      reason:
        type: string
      user_id:
        type: string
    type: object
  internal_messaging.WalletMutationCommand:
    properties:
      amount:
        example: 100
        type: integer
      app_id:
        example: my-ott-app
        type: string
      idempotency_key:
        example: order:ord-1:credit
        type: string
      metadata:
        additionalProperties: {}
        type: object
      order_id:
        example: ord-1
        type: string
      reason:
        enum:
        - TOKEN_PURCHASE
        - SPEND
        example: TOKEN_PURCHASE
        type: string
      request_id:
        example: corr-optional
        type: string
      user_id:
        example: aaaaaaaaaaaaaaaaaaaaaaaa
        type: string
    type: object
  wallet-svc_internal_dto.CreateWalletRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  wallet-svc_internal_dto.FreezeRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  wallet-svc_internal_dto.FundAppRequest:
    properties:
      amount:
        type: integer
      idempotency_key:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      order_id:
        type: string
    required:
    - amount
    - idempotency_key
    - order_id
    type: object
  wallet-svc_internal_dto.MutationRequest:
    properties:
      amount:
        type: integer
      idempotency_key:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      order_id:
        type: string
      reason:
        type: string
    required:
    - amount
    - idempotency_key
    - order_id
    - reason
    type: object
  wallet-svc_pkg_response.ErrorEnvelope:
    properties:
      code:
        type: string
      errors: {}
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  wallet-svc_pkg_response.SuccessEnvelope:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Closed-loop in-app coin wallet with double-entry ledger. Internal service APIs only. Send Authorization: Bearer &lt;HS256 JWT signed with JWT_SECRET&gt; (claims: exp), required X-Scopes and X-App-Id, optional X-Request-ID (correlation).

    RabbitMQ AMQP 1.0 (when RABBITMQ_ENABLED=true): Orders publishes credit/debit commands to x-consistent-hash exchange wallet.commands (RK=user_id). Op from reason (TOKEN_PURCHASE→credit, SPEND→debit). Success publishes wallet.credited|debited via outbox to wallet.events; permanent failures publish wallet.credit_failed|debit_failed then DLQ. HTTP credit/debit routes remain available. See tag "messaging".
  title: wallet-svc API
  version: "1.0"
paths:
  /admin/metrics:
    get:
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      - description: Comma/space-separated scopes (e.g. wallet:admin)
        in: header
        name: X-Scopes
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: In-process counters
      tags:
      - admin
  /admin/reconciliation:
    get:
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
