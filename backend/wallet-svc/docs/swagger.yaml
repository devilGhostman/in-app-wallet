        "201":
          description: Created
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Fund the app coin pool (CREDIT app + DEBIT mint)
      tags:
      - wallet
