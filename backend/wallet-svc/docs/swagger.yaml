        required: true
        type: string
      - description: Application id
        in: header
        name: X-App-Id
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      - description: reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wallet-svc_internal_dto.FreezeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Close a wallet
      tags:
      - admin
  /admin/wallets/{user_id}/freeze:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      - description: Comma/space-separated scopes (e.g. wallet:admin)
        in: header
        name: X-Scopes
        required: true
        type: string
      - description: Application id
        in: header
        name: X-App-Id
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      - description: reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wallet-svc_internal_dto.FreezeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Freeze a wallet
      tags:
      - admin
  /admin/wallets/{user_id}/unfreeze:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      - description: Comma/space-separated scopes (e.g. wallet:admin)
        in: header
        name: X-Scopes
        required: true
        type: string
      - description: Application id
        in: header
        name: X-App-Id
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      - description: reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wallet-svc_internal_dto.FreezeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Unfreeze a wallet
      tags:
      - admin
  /amqp/exchanges/wallet.commands/{user_id}:
    post:
      consumes:
      - application/json
      description: 'Orders publishes JSON to exchange wallet.commands (type x-consistent-hash)
        with routing key = user_id. AMQP 1.0 address: /exchanges/wallet.commands/{user_id}.
        Both credit and debit use this exchange; reason TOKEN_PURCHASE→Credit, SPEND→Debit.
        Same-user messages stay on one shard queue and are processed in publish order.
        No JWT; include app_id in the body.'
      parameters:
      - description: user id (also the consistent-hash routing key)
        in: path
        name: user_id
        required: true
        type: string
      - description: credit or debit command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_messaging.WalletMutationCommand'
      produces:
      - application/json
      responses:
        "202":
          description: accepted by broker (not an HTTP response)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid body → wallet.commands.dlq after consume
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Publish wallet command via consistent-hash exchange (AMQP 1.0)
      tags:
      - messaging
  /amqp/exchanges/wallet.events/{event_type}:
    post:
      consumes:
      - application/json
      description: Topic exchange wallet.events. Success events wallet.credited /
        wallet.debited come from the DB outbox publisher. Permanent settle publishes
        wallet.credit_failed / wallet.debit_failed before DLQ. Routing key = event_type.
        Bound queue order.wallet.lifecycle (RK wallet.*) is consumed by order-svc.
      parameters:
      - description: wallet.credited|wallet.debited|wallet.credit_failed|wallet.debit_failed
        in: path
        name: event_type
        required: true
        type: string
      - description: lifecycle event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_messaging.LifecycleEvent'
      produces:
      - application/json
      responses:
        "202":
          description: accepted by broker (not an HTTP response)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Publish wallet lifecycle event (AMQP 1.0)
      tags:
      - messaging
  /amqp/queues/wallet.commands.dlq:
    get:
      consumes:
      - application/json
      description: Durable queue wallet.commands.dlq (address /queues/wallet.commands.dlq).
        Body is the original WalletMutationCommand JSON. Application properties include
        x-original-queue, x-dlq, x-op, x-error, x-failed-at. Consumed manually / by
        ops tooling; wallet-svc does not reprocess DLQ automatically.
      parameters:
      - description: original failed command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_messaging.WalletMutationCommand'
      produces:
      - application/json
      responses:
        "200":
          description: message available on DLQ
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Commands dead-letter queue (AMQP 1.0)
      tags:
      - messaging
  /amqp/queues/wallet.commands/{shard}:
    get:
      consumes:
      - application/json
      description: Durable queues wallet.commands.0 … wallet.commands.{N-1} bound
        to wallet.commands with equal weight. wallet-svc consumes a subset via RABBITMQ_SHARD_INDEX
        / RABBITMQ_SHARD_COUNT (shardID % COUNT == INDEX). One consumer per shard
        among replicas; processed serially per queue.
      parameters:
      - description: shard id 0..SHARD_TOTAL-1
        in: path
        name: shard
        required: true
        type: integer
      - description: routed command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_messaging.WalletMutationCommand'
      produces:
      - application/json
      responses:
        "200":
          description: message available on shard queue
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shard command queue (AMQP 1.0)
      tags:
      - messaging
