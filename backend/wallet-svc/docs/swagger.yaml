          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Run balance invariant check
      tags:
      - admin
  /admin/wallets/{user_id}/close:
