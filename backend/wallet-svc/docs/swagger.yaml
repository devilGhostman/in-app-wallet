  /internal/wallets/{user_id}/ledger:
    get:
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      - description: Comma/space-separated scopes (e.g. wallet:admin)
        in: header
        name: X-Scopes
        required: true
        type: string
      - description: Application id
        in: header
        name: X-App-Id
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      - description: cursor
        in: query
        name: cursor
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      - description: CREDIT or DEBIT
        in: query
        name: entry_type
        type: string
      - description: TOKEN_PURCHASE or SPEND
        in: query
        name: reason
        type: string
      - description: 'created_at direction: asc or desc (default desc)'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List ledger entries
      tags:
      - wallet
securityDefinitions:
  BearerAuth:
    description: Bearer HS256 JWT signed with JWT_SECRET, e.g. "Bearer eyJ..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
