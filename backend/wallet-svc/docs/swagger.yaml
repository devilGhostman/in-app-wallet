  /internal/wallets/{user_id}/credit:
    post:
      consumes:
      - application/json
      description: HTTP equivalent of AMQP publish to exchange wallet.commands (RK=user_id;
        see messaging tag). reason must be TOKEN_PURCHASE; idempotency_key order:{order_id}:credit.
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
