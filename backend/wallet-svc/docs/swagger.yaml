            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Lookup ledger by order id
      tags:
      - wallet
  /internal/wallets:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer HS256 JWT signed with JWT_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      - description: Comma/space-separated scopes (e.g. wallet:admin)
        in: header
        name: X-Scopes
        required: true
        type: string
      - description: Application id
        in: header
        name: X-App-Id
        required: true
        type: string
      - description: Request correlation id
        in: header
        name: X-Request-ID
        type: string
      - description: user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wallet-svc_internal_dto.CreateWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wallet-svc_pkg_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
