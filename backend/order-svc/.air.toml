# Air configuration for live-reloading Go applications
# https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd"
  bin = "./tmp/main"
  entrypoint = ["./tmp/main"]
  send_interrupt = true
  kill_delay = "1s"
  delay = 500
  stop_on_error = true
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "docs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
